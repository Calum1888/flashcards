[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcards"
version = "0.1.0"
description = "A command-line flashcard quiz app with Python, ML and SQL decks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Calum Regan" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.2"]

[project.scripts]
flashcards = "flashcards.__main__:main"

[tool.setuptools.packages.find]
include = ["flashcards*"]

[tool.setuptools.package-data]
flashcards = ["decks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]